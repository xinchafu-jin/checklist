

<a class="skip-link" href="#app-main">跳至主要內容</a>

<div class="home-shell">
  <header class="app-header">
    <mat-toolbar class="app-toolbar">
      <button
        class="home-brand"
        type="button"
        routerLink="/front-home/front-dashboard"
        aria-label="Jin Survey 問卷檔案室，返回首頁"
      >
        <span class="home-brand__name">Jin Survey</span>
        <span class="home-brand__note">問卷檔案室</span>
      </button>

      <nav class="app-navigation" aria-label="主要導覽">
        @for (item of navTitle; track item.path) {
          <a
            class="navigation-link"
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            {{ item.title }}
          </a>
        }
      </nav>

      <button
        class="account-menu-trigger"
        type="button"
        [matMenuTriggerFor]="menu"
        aria-label="開啟帳號選單"
        title="帳號選單"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.25"></circle>
          <path d="M4.5 20c.8-4 3.25-6 7.5-6s6.7 2 7.5 6"></path>
        </svg>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="logout()">登出</button>
      </mat-menu>
    </mat-toolbar>
  </header>

  <main id="app-main" class="app-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
