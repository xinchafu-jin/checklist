<header class="sticky top-0 z-10 border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
    <a class="font-bold text-green-800" routerLink="/home/dashboard">Jin Survey</a>
    <button type="button" class="text-sm text-gray-600" (click)="logout()">登出</button>
  </div>

  <nav class="mx-auto flex max-w-3xl px-4" aria-label="主要導覽">
    @for (item of navTitle; track item.path) {
      <a
        class="flex-1 border-b-2 border-transparent py-2 text-center text-sm text-gray-600"
        [routerLink]="item.path"
        routerLinkActive="border-green-700! font-medium text-green-800!"
        ariaCurrentWhenActive="page"
      >
        {{ item.title }}
      </a>
    }
  </nav>
</header>

<main class="mx-auto max-w-3xl p-4">
  <router-outlet></router-outlet>
</main>
