spring.application.name=checklist
# 檢點系統的資料庫；第一次啟動時自動建立，資料表由 Flyway（db/migration）建立
# 原本問卷的 quiz1150512 保留不動
spring.datasource.url=jdbc:mysql://localhost:3306/checklist?createDatabaseIfNotExist=true&serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

